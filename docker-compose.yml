x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: file-storage-app
  env_file: .env
  volumes:
    # Общее хранилище файлов для web, планировщика и воркера
    - uploads:/var/www/html/storage/app
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      RUN_MIGRATIONS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Автоудаление: каждую минуту запускает files:purge-expired
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_started

  # Читает очередь RabbitMQ и отправляет письма (в Mailpit)
  worker:
    <<: *app
    command: ["php", "artisan", "notifications:consume-email"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql:/var/lib/mysql
    ports:
      - "${DB_FORWARD_PORT:-33060}:3306"
    healthcheck:
      # По TCP и под пользователем приложения: так проверка не пройдёт,
      # пока идёт первичная инициализация (там временный сервер без сети)
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-u", "${DB_USERNAME}", "-p${DB_PASSWORD}", "-e", "SELECT 1", "${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # SMTP-ловушка: все письма видны в веб-интерфейсе
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  uploads:
  mysql:
  rabbitmq:
